# Crime Analysis — reproducible deployment.
#
# The MVP runs self-contained (SQLite + in-process graph projection). MongoDB
# and Neo4j are provided as optional services to mirror the PRD's target stack;
# point DATABASE_URL / NEO4J_* at them to swap backing stores.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/crime_analysis.db
      - JWT_SECRET=${JWT_SECRET:-crime-analysis-dev-secret-change-me-32bytes-minimum}
      - AUTO_SEED=1
      # Optional — uncomment to use Neo4j:
      # - NEO4J_URI=bolt://neo4j:7687
      # - NEO4J_USERNAME=neo4j
      # - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    volumes:
      - crime-analysis-data:/app/data
    depends_on:
      - mongo
      - neo4j

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  crime-analysis-data:
  mongo-data:
  neo4j-data:
