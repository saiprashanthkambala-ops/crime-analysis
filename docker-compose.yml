# Crime Analysis — local development stack
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://crime_analysis:crime_analysis@postgres:5432/crime_analysis
      JWT_SECRET: ${JWT_SECRET:-crime-analysis-dev-secret-change-me-32bytes-minimum}
      AUTO_SEED: "1"
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crime_analysis
      POSTGRES_USER: crime_analysis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crime_analysis}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crime_analysis -d crime_analysis"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  postgres-data:
  neo4j-data:
